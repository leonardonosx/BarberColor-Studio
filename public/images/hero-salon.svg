<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#231D16"/>
      <stop offset="55%" stop-color="#11131A"/>
      <stop offset="100%" stop-color="#07080C"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#926C15"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirrorGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#272A36" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#101218" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <!-- Ambient Pendant Glows -->
  <circle cx="300" cy="140" r="190" fill="url(#lampGlow)"/>
  <circle cx="600" cy="120" r="220" fill="url(#lampGlow)"/>
  <circle cx="900" cy="140" r="190" fill="url(#lampGlow)"/>

  <!-- Arched Brass Salon Mirrors -->
  <g stroke="url(#gold)" stroke-width="3">
    <rect x="190" y="110" width="220" height="310" rx="110" fill="url(#mirrorGlass)"/>
    <rect x="490" y="90" width="220" height="330" rx="110" fill="url(#mirrorGlass)"/>
    <rect x="790" y="110" width="220" height="310" rx="110" fill="url(#mirrorGlass)"/>
  </g>
  <!-- Mirror Reflections -->
  <path d="M235 160 L295 290" stroke="#FDE68A" stroke-opacity="0.12" stroke-width="18" stroke-linecap="round"/>
  <path d="M535 140 L605 290" stroke="#FDE68A" stroke-opacity="0.14" stroke-width="22" stroke-linecap="round"/>
  <path d="M835 160 L895 290" stroke="#FDE68A" stroke-opacity="0.12" stroke-width="18" stroke-linecap="round"/>

  <!-- Pendant Lamps -->
  <line x1="300" y1="0" x2="300" y2="75" stroke="#D4AF37" stroke-width="2"/>
  <path d="M276 75 C276 58 324 58 324 75 Z" fill="url(#gold)"/>
  <line x1="600" y1="0" x2="600" y2="60" stroke="#D4AF37" stroke-width="2"/>
  <path d="M572 60 C572 40 628 40 628 60 Z" fill="url(#gold)"/>
  <line x1="900" y1="0" x2="900" y2="75" stroke="#D4AF37" stroke-width="2"/>
  <path d="M876 75 C876 58 924 58 924 75 Z" fill="url(#gold)"/>

  <!-- Marble Styling Counter -->
  <rect x="120" y="420" width="960" height="22" rx="6" fill="#1E2029" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="0" y="442" width="1200" height="78" fill="#090A0E"/>

  <!-- Sleek Barber/Salon Chair Silhouette Center -->
  <rect x="545" y="290" width="110" height="105" rx="22" fill="#181A22" stroke="url(#gold)" stroke-width="2.5"/>
  <rect x="530" y="385" width="140" height="24" rx="10" fill="#12141B" stroke="url(#gold)" stroke-width="2"/>
  <rect x="590" y="409" width="20" height="75" fill="url(#gold)"/>
  <ellipse cx="600" cy="488" rx="65" ry="10" fill="url(#gold)" fill-opacity="0.85"/>
</svg>
